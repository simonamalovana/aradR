name: pkgdown

on:
  push:
    branches: [main]
    paths:
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - 'R/**'
      - 'man/**'
      - 'vignettes/**'
      - 'README.md'
      - 'NEWS.md'
      - '_pkgdown.yml'
      - '.github/workflows/pkgdown.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - 'R/**'
      - 'man/**'
      - 'vignettes/**'
      - 'README.md'
      - 'NEWS.md'
      - '_pkgdown.yml'
      - '.github/workflows/pkgdown.yaml'
  workflow_dispatch:

concurrency:
  group: pkgdown-${{ github.event_name == 'pull_request' && github.run_id || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build pkgdown site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            local::.
          needs: website

      - name: Build site
        shell: Rscript {0}
        run: |
          pkgdown::build_site_github_pages(
            dest_dir = "site",
            install = FALSE,
            new_process = FALSE
          )

      - name: Verify rendered site
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/reference/index.html
          test -f site/articles/get-started.html
          test -f site/articles/find-data.html
          test -f site/articles/reliability.html
          test -f site/news/index.html
          test -f site/.nojekyll
          echo "pkgdown site contains all required landing, reference, article and news pages."

      - name: Upload site preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkgdown-site
          path: site
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy pkgdown site
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
