name: Live ARAD audit

on:
  workflow_dispatch:
    inputs:
      set_ids:
        description: "Comma-separated ARAD set IDs"
        required: false
        default: "1058,1032,1115"
      base_ids:
        description: "Comma-separated ARAD base IDs"
        required: false
        default: "MBOP,SHDPZDR"
      max_per_scope:
        description: "Maximum sampled series per set/base"
        required: true
        default: "2"
      max_series:
        description: "Maximum sampled single series overall"
        required: true
        default: "10"
      sample_per_stratum:
        description: "Series per frequency/history stratum"
        required: true
        default: "1"
      multi_size:
        description: "Indicators in one multi-series request"
        required: true
        default: "3"
      snapshot_indicator_ids:
        description: "Comma-separated snapshot-backed indicators; blank disables"
        required: false
        default: "MBOPCAHDPPECY,MBOPCCHDPPECY"
      standard_chunk_days:
        description: "Chunk size under test"
        required: true
        default: "3650"
      reference_chunk_days:
        description: "Fine reference chunk size"
        required: true
        default: "730"
  pull_request:
    paths:
      - ".github/live-audit-trigger"
      - "tools/live-audit.R"
      - ".github/workflows/live-audit.yaml"

permissions: read-all

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ARAD_API_KEY: ${{ secrets.ARAD_API_KEY }}
      ARADR_AUDIT_SET_IDS: ${{ inputs.set_ids || '1058,1032,1115' }}
      ARADR_AUDIT_BASE_IDS: ${{ inputs.base_ids || 'MBOP,SHDPZDR' }}
      ARADR_AUDIT_MAX_PER_SCOPE: ${{ inputs.max_per_scope || '2' }}
      ARADR_AUDIT_MAX_SERIES: ${{ inputs.max_series || '10' }}
      ARADR_AUDIT_SAMPLE_PER_STRATUM: ${{ inputs.sample_per_stratum || '1' }}
      ARADR_AUDIT_MULTI_SIZE: ${{ inputs.multi_size || '3' }}
      ARADR_AUDIT_SNAPSHOT_INDICATOR_IDS: ${{ inputs.snapshot_indicator_ids || 'MBOPCAHDPPECY,MBOPCCHDPPECY' }}
      ARADR_AUDIT_STANDARD_CHUNK_DAYS: ${{ inputs.standard_chunk_days || '3650' }}
      ARADR_AUDIT_REFERENCE_CHUNK_DAYS: ${{ inputs.reference_chunk_days || '730' }}
      ARADR_AUDIT_SLEEP_SECONDS: "0.75"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Install aradR
        run: R CMD INSTALL .

      - name: Verify API key exists
        shell: bash
        run: |
          if [ -z "$ARAD_API_KEY" ]; then
            echo "Repository secret ARAD_API_KEY is not configured."
            exit 1
          fi

      - name: Run staged live audit
        run: Rscript tools/live-audit.R

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aradR-live-audit
          path: audit-results/
          if-no-files-found: warn
