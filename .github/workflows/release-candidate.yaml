name: Release candidate validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/release-candidate-trigger'
      - '.github/workflows/release-candidate.yaml'
  workflow_dispatch:

permissions: read-all

jobs:
  docs:
    runs-on: ubuntu-latest
    name: pkgdown (Ubuntu)
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown
          needs: website

      - name: Install aradR
        run: R CMD INSTALL .

      - name: Build pkgdown site
        run: Rscript -e 'pkgdown::build_site(new_process = FALSE)'

      - name: Verify site output
        shell: bash
        run: test -f site/index.html

  cross-platform:
    name: ${{ matrix.os }} (release)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'
