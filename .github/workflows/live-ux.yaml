name: Live UX acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/live-ux-trigger'
      - 'tools/live-ux.R'
      - '.github/workflows/live-ux.yaml'
  workflow_dispatch:

permissions: read-all

jobs:
  ux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARAD_API_KEY: ${{ secrets.ARAD_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Install aradR
        run: R CMD INSTALL .

      - name: Verify API key exists
        shell: bash
        run: |
          if [ -z "$ARAD_API_KEY" ]; then
            echo "Repository secret ARAD_API_KEY is not configured."
            exit 1
          fi

      - name: Run live UX acceptance
        run: Rscript tools/live-ux.R

      - name: Upload UX artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aradR-live-ux
          path: ux-results/
          if-no-files-found: warn
