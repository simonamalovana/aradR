name: CRAN submit once

on:
  push:
    branches: [cran-submit-once]
    paths: ['.github/workflows/cran-submit-once.yaml']

permissions:
  actions: read
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Download validated tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -LfsS -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/11313954016/zip" -o submission.zip
          unzip -q submission.zip -d submission
          echo "95aaf2ad71cfa0c959d94bf629506bc20edb903391754ce70ffd6978ce117b5a  submission/aradR_0.2.0.tar.gz" | sha256sum -c -
      - name: Submit to CRAN
        run: |
          Rscript -e 'install.packages("xfun", repos="https://cloud.r-project.org"); xfun::submit_cran(file="submission/aradR_0.2.0.tar.gz", comment=paste(readLines("cran-comments.md"), collapse="\n"))'
