url: https://simonamalovana.github.io/aradR/
destination: site

development:
  mode: unreleased

template:
  bootstrap: 5
  light-switch: true

home:
  title: "aradR — reliable access to CNB ARAD from R"
  description: "Discover, inspect and retrieve public Czech National Bank ARAD time series with a reliability-first R workflow."

navbar:
  structure:
    left: [reference, articles, news]
    right: [search, github, lightswitch]

reference:
  - title: "Discover and understand indicators"
    desc: "Browse ARAD scopes, search human-readable metadata and inspect candidate series before retrieval."
    contents:
      - arad_catalog
      - arad_find
      - arad_info
      - arad_search
      - arad_indicators
      - arad_dimensions
      - arad_tree
      - arad_snapshots
  - title: "Retrieve and reshape data"
    desc: "Download validated time series, inspect availability and reshape long data for analysis."
    contents:
      - arad_get
      - arad_updates
      - arad_wide
  - title: "Caching"
    desc: "Manage the optional response cache used for reproducible repeated requests."
    contents:
      - arad_cache_clear

articles:
  - title: "Start here"
    contents:
      - get-started
  - title: "Guides"
    contents:
      - find-data
      - reliability
